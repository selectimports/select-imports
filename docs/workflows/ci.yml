name: Verificação

# Opcional: confere o site a cada alteração feita direto no GitHub.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verificar sintaxe, JSON, arquivos e segredos
        run: node scripts/check.mjs
